# Transmission Cost Calculator - Project Configuration
# This file contains all shared parameters across different cost calculation scripts

# Core Project Information
project:
  name: "Sample Transmission Line Project"
  description: "Example project for cost analysis"

# Financial Parameters (used across multiple scripts)
financial:
  firm_interest_rate: 0.05  # 5% annual interest rate
  risk_free_interest_rate: 0.03  # 3% risk-free interest rate
  project_lifetime: 40      # Project lifetime in years

# Terrain Configuration
terrain:
  # Miles by terrain type (must sum to total project length)
  miles:
    forested: 20.0
    scrubbed_flat: 30.0
    wetland: 5.0
    farmland: 25.0
    desert_barren: 10.0
    urban: 5.0
    rolling_hills: 3.0
    mountain: 2.0
    subsea: 0.0

# Environmental Mitigation Costs (USD per mile by terrain type)
environmental_mitigation:
  cost_per_mile:
    forested: 50000
    scrubbed_flat: 30000
    wetland: 80000
    farmland: 40000
    desert_barren: 20000
    urban: 100000
    rolling_hills: 60000
    mountain: 80000
    subsea: 150000

# AFUDC Configuration
afudc:
  terrain_adjusted_build_cost: 100000000  # Total project cost in USD
  construction_timeline: 3.0             # Construction timeline in years
  delay_timeline: 2.0                     # Delay timeline in years
  
  # Funding mix percentages
  funding_percentages:
    short_term_debt: 0.20
    long_term_debt: 0.40
    preferred_stock: 0.15
    common_stock: 0.20
    internal_reserves: 0.05
  
  # Initial funding rates
  funding_rates:
    short_term_debt: 0.04
    long_term_debt: 0.05
    preferred_stock: 0.07
    common_stock: 0.10
    internal_reserves: 0.03
  
  # Rate changes per year during delay
  rate_changes:
    short_term_debt: 0.01
    long_term_debt: 0.01
    preferred_stock: 0.01
    common_stock: 0.01
    internal_reserves: 0.01

# Delay Costs Configuration
delay_costs:
  annual_costs:
    legal: 500000
    administrative_overhead: 200000
    engineering: 300000
    permitting: 400000
    material_and_equipment: 600000
    labor: 800000
    public_relations: 100000
    environmental: 200000
    miscellaneous: 150000

# Insurance Configuration
insurance:
  premium_rate: 0.02  # 2% insurance premium
  infrastructure_costs:
    conductor_per_mile: 50000
    structure_per_mile: 100000
    converter_total: 50000000
  has_converter: true  # true for DC projects, false for AC projects

# Environmental Reporting & Compliance
environmental_reporting:
  EIS_cost: 2000000
  EIR_cost: 500000
  NEPA_cost: 1000000
  NHPA_cost: 300000
