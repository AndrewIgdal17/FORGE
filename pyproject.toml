[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-calc"
version = "3.0.0"
description = "Framework for Open Reproducible Grid Economics — calculator"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.0",
    "pandas>=3",
    "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
forge = "forge.core:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
forge = [
    "yamls/**/*.yaml",
    "yamls/**/*.yml",
    "scenarios/**/*.forge",
    "scenarios/**/*.yaml",
    "presets/**/*.yaml",
    "data/emissions/**",
    "data/cpi_u.csv",
    "data/converted_defaults.yaml",
]

[tool.pytest.ini_options]
testpaths = ["test", "forge/scripts/tests"]
filterwarnings = ["error::pytest.PytestReturnNotNoneWarning"]

[dependency-groups]
dev = [
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
]
build = ["openpyxl>=3.1"]

[tool.uv]
default-groups = ["dev", "build"]
