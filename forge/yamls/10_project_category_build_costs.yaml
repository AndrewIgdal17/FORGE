# Project Build Costs
# Construction costs for all 128 transmission project configurations
# Based on comprehensive cost database with variable and fixed cost components
# OH conductor Variable Conductor Cost: 2025$ native from MISO MTEP25 Workbook
#   Tables 2.2-11/12 (ACSR/ACSS), 2.2-13 (ACCC), 2.2-14 (OPGW+shieldwire), 3.1-5/3.1-6 (selection).
#   Formula: ((mat+inst+acc)/1000ft × 5.28 × n_wires) + (2×OPGW + 1×shieldwire)/1000ft × 5.28
#   where n_wires = cond_per_phase × phases × circuits/poles. No 4% sag/waste adder (matches Skiles pipeline).
# Converter Fixed Converter Cost: 2025$ native, ONE END from Tables 2.4-1 (LCC) / 2.4-2 (VSC);
#   code multiplies by number_of_converters (typically 2). Component sum → $.
# Non-OH conductor/structure: IET (2012 GBP→2023$→2025$).
# Structure costs (OH only): 2025$ (MISO MTEP25 steel-tower derivation, Tables 2.2-2/2.2-8 × 3.1-2/3.1-4).
# Note: 500kV AC structure ($1,245,017) is +19.8% vs prior — outlier under investigation (pole-vs-tower table choice).

soft_cost_multiplier: 0.10 # 10% adder on contingency-applied direct costs (PM, engineering, A&G). MISO MTEP25 Cost Estimation Guide; AACE 96R-18 owner's/indirect cost categories.

