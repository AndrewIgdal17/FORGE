# Project Technical Details
# Core technical specifications for the transmission project

project:
  construction_type: "Overhead" # Overhead, Underground direct-buried, Underground Tunnel
  ac_dc: "AC" # AC or DC
  number_of_converters: 0 # 1 or 2
  capacity_mw: null # MW; required, and must be > 0
  conductor_type: "Standard Aluminum Conductor" # Standard Aluminum Conductor, Advanced Aluminum Conductor, Underground Copper Conductor
  converter_type: "NA" # LCC Converter or VSC Converter
  converter_loss_percentage: # Optional: Loss percentage [0,1] (defaults: 0.0075 for LCC, 0.01 for VSC)

  line_utilization: 0.70 # % [0,1]

  value_of_load_per_mwh: null # $/MWh (>= 0)

  project_type: "greenfield" # "greenfield" | "reconductoring" | "rebuild"
  sending_source: "margin" # "margin" (regional margin) or "dedicated"
  dedicated_resource:
    contract_price_per_mwh: null # $/MWh, all-in (energy and capacity)
    emission_rate_kg_per_mwh:
      co2e: null
      so2: null
      nox: null
  row_agreement_type: null # permanent_easement_new | federal_hybrid | lease_license_existing; null = permanent_easement_new for greenfield, lease_license_existing for reconductoring and rebuild
  old_capacity_mw: null # MW
  old_conductor_type: null # Standard Aluminum Conductor, Advanced Aluminum Conductor, Underground Copper Conductor
  old_ac_dc: null # AC or DC
  old_converter_type: null

timeline:
  construction_years: 1 # years (> 0)
  delay_years: 0 # years (>= 0)
  project_lifetime: 40 # years (> 0)
  baseline_delay_years: 0


### DEFINITIONS:
# 1) Electricity price: $/MWh
#    - The system marginal energy price at some reference point. Reperesents the marginal cost of serving an additonal MWh.
