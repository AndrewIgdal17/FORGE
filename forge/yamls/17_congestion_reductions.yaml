# Congestion Reductions — single-constraint congestion relief
# Relief equals effective capacity when exceedance is empty, else min(effective, exceedance).
# Annual congestion benefit = 1[margin] * 8760 * relief * spread.

# Real annual benefit price escalation applied to congestion, delivered energy,
# capacity value, and the value of losses.
benefit_price_escalation_real: 0.01  # real; Chang, Pfeifenberger and Hagerty (2013)

greenfield_congestion_reductions:
  constraints:
    flow_factor: null       # deliverability to the targeted constraint [0,1]
    average_exceedance: null   # X: empty means equal to effective capacity; a value is >= 0
  prices:
    average_congestion_price: null    # congestion spread, $/MWh, mean over all 8,760 hours

incremental_congestion_reductions:
  constraints:
    average_exceedance: null
  prices:
    average_congestion_price: null
