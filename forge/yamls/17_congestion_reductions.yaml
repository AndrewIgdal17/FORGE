# Congestion Reductions — single-constraint congestion relief
# B_cong = H * min(delta_C_eff, X) * gamma_cong

# Real annual benefit price escalation applied to congestion, delivered energy,
# capacity value, and the value of losses.
benefit_price_escalation_real: 0.01  # real; Chang, Pfeifenberger and Hagerty (2013)

greenfield_congestion_reductions:
  constraints:
    flow_factor: 0          # deliverability to the targeted constraint [0,1]
    constrained_hours: 0    # H: total hours/yr the constraint binds (>= 0)
    average_exceedance: 0   # X: average MW exceedance during constrained hours (>= 0)
  prices:
    average_congestion_price: 0    # gamma_cong: $/MWh redispatch cost

incremental_congestion_reductions:
  constraints:
    constrained_hours: 0
    average_exceedance: 0
  prices:
    average_congestion_price: 0
