# Insurance / Risk-Bearing Cost Parameters
# Annual risk-bearing costs for transmission line assets.
# Overhead/underground: self-insurance reserve rate (commercial T&D coverage unavailable).
# Converter: commercial property insurance rates.

insurance:
  premium_rate_default: 0.002
  premium_rate_by_type:
    overhead: 0.002
    underground_direct_buried: 0.002
    underground_tunnel: 0.002
    converter: 0.007
  escalation_rate: 0.02
  insurable_components:
    conductors: true
    structures: true
    converters: true
