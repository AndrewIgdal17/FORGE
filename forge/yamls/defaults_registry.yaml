  # --- Financial parameters ---
  financial:
    inflation_rate:
      path: "03_financing.financial.inflation_rate"
      unit: "decimal"
      source: "SSA 2025 Trustees Report long-range assumptions"
      citation: "SSATrustees2025"
      yaml_file: "03_financing.yaml"
      basis: "Sourced"
    base_year:
      path: "03_financing.financial.base_year"
      unit: "year"
      source: "Model convention"
      citation: ~
      yaml_file: "03_financing.yaml"
      basis: "Author judgment"
    wacc_nominal:
      path: "03_financing.financial.wacc_nominal"
      unit: "decimal"
      source: "CPUC 2025 Cost of Capital fact sheet"
      citation: "CPUC2025CoC"
      yaml_file: "03_financing.yaml"
      basis: "Sourced"
    social_discount_rate:
      path: "03_financing.financial.social_discount_rate"
      unit: "decimal"
      source: "OMB Circular A-4 (2023 revision), 2% near-term Ramsey rate"
      citation: "OMB2023CircularA4; Rennert2022"
      yaml_file: "03_financing.yaml"
      basis: "Sourced"
    construction_cost_escalation_rate:
      path: "03_financing.financial.construction_cost_escalation_rate"
      unit: "decimal (nominal annual)"
      source: "MISO MTEP25 planning methodology"
      citation: "MISO2025CostGuide"
      yaml_file: "03_financing.yaml"
      basis: "Sourced"
    benefit_price_escalation_real:
      path: "17_congestion_reductions.benefit_price_escalation_real"
      unit: "decimal (real annual)"
      source: "Flat-price default aligned with current CAISO TEAM practice"
      citation: "CAISO2004TEAM; ChangPfeifenbergerHagerty2013"
      yaml_file: "17_congestion_reductions.yaml"
      basis: "Sourced"
    row_rent_escalation_real:
      path: "11_project_row_details.row_rent_escalation_real"
      unit: "decimal (real annual)"
      source: "BLM rents already adjust at IPD-GDP rate (~2.6%/yr nominal)"
      citation: "BLM2026PIM2026002; CFR_43_2806_22"
      yaml_file: "11_project_row_details.yaml"
      basis: "Sourced"

  # --- Construction spending profiles (S-curve weights) ---
