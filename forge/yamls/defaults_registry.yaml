# FORGE Defaults Registry
# Snapshot date: 2026-09-25
# Reference-only snapshot of methodology defaults. Not imported at runtime.
# Role: Reference only — the calculator reads defaults from individual YAML files.
# The `yaml_file` field in each entry points to the runtime source.

# ===========================================================================
# 1. UTILITIES (Weighted Miles, Financial Parameters, Spending Profiles)
# ===========================================================================
