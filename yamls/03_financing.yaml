# Financing Parameters
financial:
  inflation_rate: 0.03
  base_year: 2025
  wacc_nominal: 0.075
  social_discount_rate: 0.02 # OMB Circular A-4 (Nov 2023 revision), Ramsey framework, 2% near-term rate. Supported by Rennert et al. (2022), Nature 610:687-692.
  cost_base_year: 2025  # All cost parameters normalized to this year's constant dollars.
  construction_cost_escalation_rate: 0.025  # 2.5%/yr nominal. MISO MTEP25 planning methodology.

  contingencies:
    conductor_contingency: .20 # % [0,1]. MISO MTEP25 planning-level contingency (MISO, 2025).
    structure_contingency: .20 # % [0,1]. MISO MTEP25 planning-level contingency (MISO, 2025).
    converter_contingency: .20 # % [0,1]. MISO MTEP25 planning-level contingency (MISO, 2025).


  # AFUDC configuration
  afudc:
    apply_afudc: true # Toggle AFUDC calculations on/off
    # Cost-specific AFUDC application during delay period
    # true = AFUDC accrues if active work continues (permitting, design, CWIP-eligible costs)
    # false = AFUDC suspended during delay (conservative default per FERC)
    delay_period_active_work: false

  # Revenue structures (firm perspective)
  revenue:
    # Rate-based revenue requirement (return on rate base)
    rate_based:
      enabled: true # Toggle rate-based revenue calculation
      allowed_return_rate: 0.075 # Simplified overall return on rate base (≈ WACC nominal). Consistent with FERC-authorized ROE ~10% (EL14-12, Oct 2024) weighted by typical 50/50 capital structure + ~5.5% cost of debt.
