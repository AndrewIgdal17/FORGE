# Congestion and Curtailment Reductions — Single-constraint, two-price decomposition
# Single-constraint, two-price decomposition.
# B_cong = H * f * min(delta_C_eff, X) * gamma_cong
# B_curt = H * (1-f) * min(delta_C_eff, X) * gamma_curt

# Real annual benefit price escalation rate applied to all benefit streams.
# At 0.0 the formulas collapse to the flat-annuity behavior (backward compatible).
benefit_price_escalation_real: 0.01

greenfield_congestion_curtailment_reductions:
  constraints:
    flow_factor: 0          # deliverability to the targeted constraint [0,1]
    constrained_hours: 0    # H: total hours/yr the constraint binds (>= 0)
    average_exceedance: 0   # X: average MW exceedance during constrained hours (>= 0)
    congestion_fraction: 0.5  # f: fraction of constrained hours where consequence is redispatch (0-1; rest is curtailment)
  prices:
    average_congestion_price: 0    # gamma_cong: $/MWh redispatch cost
    average_curtailment_price: 0   # gamma_curt: $/MWh foregone energy value

reconductoring_congestion_curtailment_reductions:
  constraints:
    constrained_hours: 0
    average_exceedance: 0
    congestion_fraction: 0.5
  prices:
    average_congestion_price: 0
    average_curtailment_price: 0
