# Outage Cost Parameters
# Expected outage costs based on reliability parameters

outage:
  # Risk growth
  risk_growth_rate: 0.0 # Annual increase in outage rates (default: 0)

  # Discount rate
  discount_rate_type: "social" # Options: "social" | "wacc_real"

  # Capacity at risk factor (φ)
  capacity_at_risk_factor: 1.0 # 1.0 = radial, <1.0 = meshed/redundant

  # Value of lost load (tiered by outage duration)
  # Piecewise valuation: different hours valued at different rates
  value_of_lost_load:
    tiers:
      - max_hours: 4 # Short: 0-4 hours
        value_per_mwh: 5000
      - max_hours: 24 # Medium: 4-24 hours
        value_per_mwh: 10000
      - max_hours: .inf # Long: >24 hours (use .inf for infinity)
        value_per_mwh: 15000

  # Outage duration by terrain (hours per event)
  outage_duration_by_terrain:
    forested: 8
    scrubbed_flat: 4
    wetland: 6
    farmland: 3
    desert_barren: 5
    urban: 2
    rolling_hills: 6
    mountain: 12
    subsea: 240

  # Duration multiplier by construction type
  # H_eff[construction][terrain] = duration_by_terrain[terrain] × multiplier[construction]
  outage_duration_multiplier:
    overhead: 1.0
    underground: 2.0
    subsea: 3.0

  # Outage rates by construction type × terrain (SIMPLIFIED)
  # Direct: outages per mile per year (no f × p split)
  outage_rates: # [construction_type][terrain]
    overhead:
      forested: 0.04 # outages/mile/year
      scrubbed_flat: 0.021
      wetland: 0.012
      farmland: 0.016
      desert_barren: 0.03
      urban: 0.0075
      rolling_hills: 0.025
      mountain: 0.051
      subsea: 0.009
    underground:
      forested: 0.005
      scrubbed_flat: 0.0032
      wetland: 0.009
      farmland: 0.0025
      desert_barren: 0.004
      urban: 0.0015
      rolling_hills: 0.0045
      mountain: 0.006
      subsea: 0.0056
    subsea:
      # All terrain values same for subsea (irrelevant once underwater)
      forested: 0.00475
      scrubbed_flat: 0.00475
      wetland: 0.00475
      farmland: 0.00475
      desert_barren: 0.00475
      urban: 0.00475
      rolling_hills: 0.00475
      mountain: 0.00475
      subsea: 0.00475
