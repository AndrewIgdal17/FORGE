# Project Category O&M Structures
# Operations and maintenance costs for transmission structures across all 128 transmission project configurations
#
# Note: Structure O&M costs are based solely on installation method, not on individual capacity/conductor/converter configurations.
# All overhead configurations share the same structure-related fields.
# All non-overhead configurations share the same variable_cost_per_mile_year.

project_categories_om_structures:
  # OVERHEAD CONFIGURATIONS
  # All overhead transmission lines (AC and DC, all capacities, all conductor types, all converter types)
  # share the same structure maintenance costs based on terrain type.

  "Overhead":
    structures_per_mile_forested: 10 # structures/mile [terrain type]
    structures_per_mile_scrubbed_flat: 6 # structures/mile [terrain type]
    structures_per_mile_wetland: 6 # structures/mile [terrain type]
    structures_per_mile_farmland: 6 # structures/mile [terrain type]
    structures_per_mile_desert_barren: 6 # structures/mile [terrain type]
    structures_per_mile_urban: 10 # structures/mile [terrain type]
    structures_per_mile_rolling_hills: 8 # structures/mile [terrain type]
    structures_per_mile_mountain: 12 # structures/mile [terrain type]
    cost_per_structure_per_year: 1000 # $/structure/year

  # UNDERGROUND DIRECT-BURIED CONFIGURATIONS
  # All underground direct-buried transmission lines share the same variable maintenance cost per mile per year.

  "Underground direct-buried":
    variable_cost_per_mile_year: 0

  # UNDERGROUND TUNNEL CONFIGURATIONS
  # All underground tunnel transmission lines share the same variable maintenance cost per mile per year.

  "Underground tunnel":
    variable_cost_per_mile_year: 0

  # SUBSEA CONFIGURATIONS
  # All subsea transmission lines share the same variable maintenance cost per mile per year.

  Subsea:
    variable_cost_per_mile_year: 0
