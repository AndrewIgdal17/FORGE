# Wildfire Risk Cost Parameters
# Expected wildfire costs based on ignition rates and severity

wildfire:
  # Event severity (consequence)
  severity_per_event: 5000000000 # Mean loss per wildfire event ($/event)

  # Risk growth (optional - wildfire risk increases over time)
  risk_growth_rate: 0.02 # Annual increase in ignition probability (2%)

  # Discount rate configuration
  discount_rate_source: "social" # Options: "social" | "wacc_real" | "custom"
  discount_rate_custom: 0.03 # Used only if discount_rate_source = "custom"

  # Base ignition rates by terrain (for overhead baseline)
  # Units: events per mile per year
  ignition_rates_by_terrain:
    forested: 0.0001 # Higher risk in forested areas
    scrubbed_flat: 0.00005
    wetland: 0.00001 # Lower risk in wet areas
    farmland: 0.00003
    desert_barren: 0.00008
    urban: 0.00002
    rolling_hills: 0.00006
    mountain: 0.0001
    subsea: 0.0 # No wildfire risk subsea

  # Ignition rate multiplier by construction type
  # Effective rate = ignition_rates_by_terrain × multiplier
  ignition_rate_multiplier:
    overhead: 1.0 # Baseline (100% of overhead risk)
    underground: 0.02 # 98% reduction (2% of overhead risk)
    subsea: 0.0 # No wildfire risk
