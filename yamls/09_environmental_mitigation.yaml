# Environmental Mitigation Costs
# Costs per mile by terrain type for environmental mitigation

environmental_mitigation:
  mitigation_uplift_factor: 1.25 # to account for the fact that the width isnt just row width but also consturciton width via TCEs
  mitigation_ratio: 2.0 # Compensatory mitigation ratio (impacted acres × ratio = credits required). Default 2.0 per 33 CFR §332.3(f) Category II preservation (USACE, 2014).

  # All-in construction/restoration mitigation ($/acre) by terrain + construction type
  base_mitigation_cost_per_acre:
    overhead:
      forested: 5000
      scrubbed_flat: 1000
      wetland: 5000
      farmland: 800
      desert_barren: 1000
      urban: 1500
      rolling_hills: 1500
      mountain: 7000
      subsea: 1000 # onshore landfall/construction yard

    underground_direct_buried:
      forested: 5000
      scrubbed_flat: 1000
      wetland: 10000
      farmland: 800
      desert_barren: 1000
      urban: 2000
      rolling_hills: 1500
      mountain: 9000
      subsea: 1000

    underground_tunnel:
      forested: 5000
      scrubbed_flat: 1000
      wetland: 10000
      farmland: 800
      desert_barren: 1000
      urban: 2000
      rolling_hills: 1500
      mountain: 9000
      subsea: 1000
      linear_corridor_default: 1500 # if terrain not known
      shaft_site_default: 1000 # pad/disturbed site avg cost

    subsea:
      seabed_corridor_default: 0 # passive recovery (no cost)
      landfall_default: 1000 # for basic onshore site (flat/open)

  # Credit purchases (off-site mitigation via banks)
  wetland_credit_cost_per_acre: 51361 # MISO MTEP25 Workbook Table 2.2-9: $51,360.69/acre (MISO, 2025).

  habitat_credit_cost_per_acre:
    forested: 30000
    scrubbed_flat: 30000
    desert_barren: 30000
    rolling_hills: 30000
    mountain: 30000
