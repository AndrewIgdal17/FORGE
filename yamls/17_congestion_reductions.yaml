# Congestion Reductions
# Cost savings from reduced transmission congestion

greenfield_congestion_reductions:
  constraints:
    # We need the capacity from project technical details
    flow_factor: .5 # flow factor is deliverability to the targeted constrained [0,1]
    # delta C_eff = S * capacity
    binding_hours: 0 # binding hours is the number of hours per year that the line is binding
    average_exceedance: 0 # MW exceedance during binding hours
    # baseline congestion energy = H_b * X mwh/yr
    near_binding_hours: 0 # near binding hours is the number of hours per year that the line is near binding
    near_average_exceedance: 0 # MW exceedance during near binding hours
    # near baseline congestion energy = H_n * X mwh/yr
    near_binding_relief_factor: # [0,1] 
    saturation_factor: 0 # [0, something greater than 0??] # bascially 0 fora radial line and more for a meshed system 
  
  costs:
    average_congestion_price: 0 # $/mwh
    average_curtailment_price: 0 # $/mwh
    value_of_lost_load: 0 # $/mwh # I alredady have this in the outages section will need to think about it 

