# O&M Vegetation Management
# Annual vegetation management costs by terrain type (overhead only; non-overhead = $0).
# Sources: DOE/LBNL Vegetation Management Resilience Guide (2024), Quanta Technology
# for PUCT (2009), Backwell Contractors (2024), BPA (2021), LIFE Elia-RTE (~2015).
# Terrain ordering: forested > mountain > wetland > scrubbed > urban > rolling > farmland > desert.

vegetation_management_om_costs: # cost per mile [construction type][terrain type]
  Overhead:
    forested: 14367      # $/mile/year, 2025$ (CPI-U from ~2024$, ×1.0262). Duke Energy FL $42K/3yr cycle (DOE 2024).
    mountain: 12314      # $/mile/year, 2025$ (CPI-U from ~2024$, ×1.0262). BPA helicopter 8× ground (2021); LIFE Elia-RTE steep terrain.
    wetland: 8210        # $/mile/year, 2025$ (CPI-U from ~2024$, ×1.0262). Xcel MN (DOE 2024); environmental access restrictions.
    scrubbed_flat: 5131  # $/mile/year, 2025$ (CPI-U from ~2024$, ×1.0262). Backwell mechanical mulching $3.8–8.5K/acre.
    urban: 1000          # $/mile/year, 2025$. Author judgment: urban overhead is structurally rare (dense cores use UG); minimal vegetation where OH does exist. No utility source isolates urban-specific transmission VM.
    rolling_hills: 4747  # $/mile/year, 2025$ (CPI-U from $4,316/mi/yr, 2022$, ×1.0999). Duke Energy Indiana 2022 system-wide transmission VM avg (Cause No. 43663).
    farmland: 1196       # $/mile/year, 2025$ (CPI-U from 2008$, ×1.4951). Quanta/PUCT 2009, FY2008 utility data.
    desert_barren: 449   # $/mile/year, 2025$ (CPI-U from 2008$, ×1.4951). AEP TX North 61-year cycle (Quanta/PUCT 2009).
    subsea: 0            # $/mile/year. Not applicable.

  Underground Direct Buried:
