# Curtailment Reductions
# Cost savings from reduced renewable energy curtailment

# Curtailment Reductions
# Cost savings from reduced renewable energy curtailment (at this interface)

curtailment_reductions:
  # Hours per year with curtailment on the exporting side of THIS constraint
  curtailment_hours_total: 300 # hrs/yr (set 0 if not applicable)

  # ...or average curtailed MW in those hours (leave at 0 if using total MWh)
  average_curtailment_mw: 60 # MW

  average_curtailment_price: 25 # $/MWh (PPA proxy / avoided cost)

  curtailment_saturation_factor: 0.1 # [0,1]
