# Project Right-of-Way Details
# ROW acquisition and management costs
# BLM Per-Acre Linear Rent Schedule for Calendar Years 2026-2035.
# Acquisition values: per-acre zone values (unchanged from 2016-2025).
# Rent values: CY 2026 column, 2.6% IPD-GDP annual adjustment.
# Rents and holds deflated to 2025$ (CPI-U from CY2026, ×0.9728).
# Source: https://www.blm.gov/sites/default/files/docs/2026-05/Per_Acre_Linear_Rent_Schedule_for_Calendar_Years_2026-2035.pdf
# NOTE: These defaults apply to federal (BLM) lands only. Private-land projects should override with site-specific values.
# All values: miles (>= 0), costs (>= 0)

# Real annual escalation rate applied to annual ROW rent (and holding/option-fee cost), decimal.
# Default 0% real: BLM rents already adjust at the IPD-GDP rate (~2.6%/yr nominal, CY2026-2035),
# approximately tracking inflation (BLM PIM 2026-002, 43 CFR Sec 2806.22); no evidence supports
# systematic above-inflation rent growth for transmission ROW as a default.
row_rent_escalation_real: 0.00

right_of_way:
  zone_1:
    miles: 0
    acquisition_cost: 299 #$/acre
    rent_cost: 8 #$/acre * year (2025$, deflated from CY 2026 via CPI-U ×0.9728)
    hold_cost: 0.800 #$/acre (default .1 of rent cost) (2025$, deflated from CY 2026 via CPI-U ×0.9728)
