name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v5
        with:
          version: "0.12.23"
      - run: uv lock --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v5
        with:
          version: "0.12.23"
      - run: uv sync --frozen --extra dev --python python
      - run: uv run pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v5
        with:
          version: "0.12.23"
      - name: Build wheel
        run: uv build
      - name: Install wheel and run bundled scenarios
        run: |
          python -m venv /tmp/forge-wheel
          /tmp/forge-wheel/bin/pip install --disable-pip-version-check dist/*.whl
          cd /tmp
          /tmp/forge-wheel/bin/python - <<'PY'
          import json
          import math
          import sys

          import forge

          scenarios = sorted(forge.get_scenarios_path().glob("*.forge"))
          if not scenarios:
              sys.exit("no bundled .forge files")
          for path in scenarios:
              doc = json.loads(path.read_text())
              changes = forge.diff_changes(doc["inputs"])
              resolved = forge.resolve_inputs(changes)
              results = forge.run_calculation(resolved, scenario_id=path.stem)
              bcr = results.get("bcr") or {}
              finite = [
                  key
                  for key, value in bcr.items()
                  if key.startswith("bcr_")
                  and isinstance(value, (int, float))
                  and not isinstance(value, bool)
                  and math.isfinite(value)
              ]
              if not results.get("provenance"):
                  sys.exit(f"{path.name}: missing provenance")
              if not finite:
                  sys.exit(f"{path.name}: no finite BCR")
              print(f"{path.name}: {len(finite)} finite BCRs", flush=True)
          PY

  tag-check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v5
        with:
          version: "0.12.23"
      - run: uv sync --frozen --python python
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("forge-calc"))')"
          EXPECTED="v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag ${TAG} does not match package version ${EXPECTED}"
            exit 1
          fi
          echo "Tag ${TAG} matches package version ${EXPECTED}"
